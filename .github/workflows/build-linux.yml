name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (fallback)
        run: |
          git submodule update --init --recursive

      - name: Download and install Vulkan SDK
        run: |
          set -euo pipefail
          
          # Use direct CDN download with a stable version
          SDK_VERSION="1.3.290"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkansdk-linux-x86_64-${SDK_VERSION}.tar.gz"
          
          echo "Downloading Vulkan SDK ${SDK_VERSION}..."
          mkdir -p ~/vulkan-sdk
          cd ~/vulkan-sdk
          
          # Download with verbose output and retry
          wget --no-verbose --show-progress "$SDK_URL" -O vulkan-sdk.tar.gz || \
          curl -L --progress-bar "$SDK_URL" -o vulkan-sdk.tar.gz
          
          echo "Extracting Vulkan SDK..."
          tar -xzf vulkan-sdk.tar.gz
          
          # Find the extracted SDK directory
          SDK_DIR=$(ls -d ${PWD}/*/ 2>/dev/null | head -1)
          if [ -z "$SDK_DIR" ]; then
            echo "Error: SDK directory not found after extraction"
            ls -la
            exit 1
          fi
          
          echo "SDK extracted to: $SDK_DIR"
          echo "VULKAN_SDK=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/bin" >> $GITHUB_PATH
          
          # Verify key files exist
          ls -la "$SDK_DIR/include/vulkan/" | head -10

      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update

          # Base packages required for build and common dev headers
          PKGS_BASE="libglfw3-dev build-essential cmake pkg-config \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libwayland-egl1-mesa libwayland-cursor0 \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev"
          echo "Installing base packages: $PKGS_BASE"
          sudo apt-get install -y --no-install-recommends $PKGS_BASE

          # Helper: check whether apt has a candidate for a package
          has_candidate() {
            pkg="$1"
            cand=$(apt-cache policy "$pkg" 2>/dev/null | awk '/Candidate:/ {print $2}')
            if [ -n "$cand" ] && [ "$cand" != "(none)" ]; then
              return 0
            fi
            return 1
          }

          # Attempt to install an optional Vulkan validation package if available
          if has_candidate vulkan-validationlayers-dev; then
            echo "Installing vulkan-validationlayers-dev"
            sudo apt-get install -y --no-install-recommends vulkan-validationlayers-dev
          else
            echo "No Vulkan validation/utility package available; continuing without it"
          fi

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAN_SDK=${{ env.VULKAN_SDK }}

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neutrino-linux
          path: build/bin/Neutrino

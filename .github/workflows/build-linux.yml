name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (fallback)
        run: |
          git submodule update --init --recursive

      - name: Install dependencies (robust, with alternatives)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update

          # Base packages required for build (leave out packages with uncertain names)
          PKGS_BASE="vulkan-tools libvulkan-dev libglfw3-dev build-essential cmake pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libasound2-dev"
          echo "Installing base packages: $PKGS_BASE"
          sudo apt-get install -y --no-install-recommends $PKGS_BASE

          # Helper: check whether apt has a candidate for a package
          has_candidate() {
            pkg="$1"
            cand=$(apt-cache policy "$pkg" 2>/dev/null | awk '/Candidate:/ {print $2}')
            if [ -n "$cand" ] && [ "$cand" != "(none)" ]; then
              return 0
            fi
            return 1
          }

          # Helper: attempt to install the first available package from a list
          try_install_first_available() {
            for pkg in "$@"; do
              if has_candidate "$pkg"; then
                echo "Installing $pkg"
                sudo apt-get install -y --no-install-recommends "$pkg"
                return 0
              fi
            done
            return 1
          }

          # Install Vulkan validation/utility package if available
          if try_install_first_available vulkan-validationlayers-dev vulkan-utility-libraries-dev; then
            echo "Installed a Vulkan validation/utility package"
          else
            echo "No Vulkan validation/utility package available; continuing without it"
          fi

          # Install Wayland EGL / cursor alternatives if available
          # Try common alternative package names to cover different distros/images
          try_install_first_available libwayland-egl-dev libwayland-egl1-mesa libwayland-egl1
          if [ $? -ne 0 ]; then
            echo "No libwayland-egl package available; continuing"
          fi

          try_install_first_available libwayland-cursor-dev libwayland-cursor0
          if [ $? -ne 0 ]; then
            echo "No libwayland-cursor package available; continuing"
          fi

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neutrino-linux
          path: build/bin/Neutrino

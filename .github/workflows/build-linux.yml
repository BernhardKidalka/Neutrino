name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (fallback)
        run: |
          git submodule update --init --recursive

      - name: Install dependencies (robust)
        run: |
          set -euo pipefail
          sudo apt-get update

          # Install base packages needed for build
          PKGS_BASE="vulkan-tools libvulkan-dev libglfw3-dev build-essential cmake"
          echo "Installing base packages: $PKGS_BASE"
          sudo apt-get install -y $PKGS_BASE

          # Try to install a validation/utility package; fall back if first is unavailable
          echo "Attempting to install Vulkan validation layers or utility libraries"
          if sudo apt-get install -y vulkan-validationlayers-dev; then
            echo "Installed vulkan-validationlayers-dev"
          elif sudo apt-get install -y vulkan-utility-libraries-dev; then
            echo "Installed vulkan-utility-libraries-dev"
          else
            echo "No Vulkan validation/utility package available; continuing without it"
          fi

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neutrino-linux
          path: build/bin/Neutrino

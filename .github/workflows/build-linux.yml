name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y vulkan-tools libvulkan-dev vulkan-validationlayers-dev libglfw3-dev build-essential cmake
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: neutrino-linux
        path: build/bin/Neutrino

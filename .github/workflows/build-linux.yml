name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (fallback)
        run: |
          git submodule update --init --recursive

      - name: Download and install Vulkan SDK
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          
          # Download the latest Vulkan SDK for Linux
          SDK_VERSION="1.4.304"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz"
          
          echo "Downloading Vulkan SDK ${SDK_VERSION}..."
          mkdir -p ~/vulkan-sdk
          cd ~/vulkan-sdk
          wget -q "$SDK_URL" -O vulkan-sdk.tar.xz
          tar -xf vulkan-sdk.tar.xz
          
          # Set environment variables
          VULKAN_SDK_DIR=$(ls -d ~/vulkan-sdk/*/ | head -1)
          echo "VULKAN_SDK=${VULKAN_SDK_DIR}" >> $GITHUB_ENV
          echo "${VULKAN_SDK_DIR}/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update

          # Base packages required for build and common dev headers
          PKGS_BASE="vulkan-tools libglfw3-dev build-essential cmake pkg-config \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libwayland-egl1-mesa libwayland-cursor0 \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev"
          echo "Installing base packages: $PKGS_BASE"
          sudo apt-get install -y --no-install-recommends $PKGS_BASE

          # Helper: check whether apt has a candidate for a package
          has_candidate() {
            pkg="$1"
            cand=$(apt-cache policy "$pkg" 2>/dev/null | awk '/Candidate:/ {print $2}')
            if [ -n "$cand" ] && [ "$cand" != "(none)" ]; then
              return 0
            fi
            return 1
          }

          # Attempt to install an optional Vulkan validation package if available
          if has_candidate vulkan-validationlayers-dev; then
            echo "Installing vulkan-validationlayers-dev"
            sudo apt-get install -y --no-install-recommends vulkan-validationlayers-dev
          elif has_candidate vulkan-utility-libraries-dev; then
            echo "Installing vulkan-utility-libraries-dev"
            sudo apt-get install -y --no-install-recommends vulkan-utility-libraries-dev
          else
            echo "No Vulkan validation/utility package available; continuing without it"
          fi

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neutrino-linux
          path: build/bin/Neutrino

name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (fallback)
        run: |
          git submodule update --init --recursive

      - name: Install Vulkan SDK dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          
          # Install dependencies that vulkan-sdk needs
          sudo apt-get install -y --no-install-recommends \
            libyaml-cpp0.7 \
            libyaml-0-2
          
          # Add LunarG repository (with key handling for newer Ubuntu)
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /etc/apt/keyrings/lunarg-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/lunarg-archive-keyring.gpg] https://packages.lunarg.com/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan-jammy.list
          sudo apt-get update
          
          # Install vulkan-sdk
          sudo apt-get install -y --no-install-recommends vulkan-sdk

      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update

          # Base packages required for build and common dev headers
          PKGS_BASE="libglfw3-dev build-essential cmake pkg-config \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libwayland-egl1-mesa libwayland-cursor0 \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libasound2-dev"
          echo "Installing base packages: $PKGS_BASE"
          sudo apt-get install -y --no-install-recommends $PKGS_BASE

          # Helper: check whether apt has a candidate for a package
          has_candidate() {
            pkg="$1"
            cand=$(apt-cache policy "$pkg" 2>/dev/null | awk '/Candidate:/ {print $2}')
            if [ -n "$cand" ] && [ "$cand" != "(none)" ]; then
              return 0
            fi
            return 1
          }

          # Attempt to install an optional Vulkan validation package if available
          if has_candidate vulkan-validationlayers-dev; then
            echo "Installing vulkan-validationlayers-dev"
            sudo apt-get install -y --no-install-recommends vulkan-validationlayers-dev
          else
            echo "No Vulkan validation/utility package available; continuing without it"
          fi

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neutrino-linux
          path: build/bin/Neutrino

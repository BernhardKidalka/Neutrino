name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Init submodules (fallback)
        run: |
          git submodule update --init --recursive

      - name: Install dependencies (robust)
        run: |
          sudo apt-get update

          # Base packages
          PKGS="vulkan-tools libvulkan-dev libglfw3-dev build-essential cmake"

          # Pick a validation-layers package if available
          if apt-cache show vulkan-validationlayers-dev >/dev/null 2>&1; then
            echo "Found vulkan-validationlayers-dev"
            PKGS="$PKGS vulkan-validationlayers-dev"
          elif apt-cache show vulkan-utility-libraries-dev >/dev/null 2>&1; then
            echo "Found vulkan-utility-libraries-dev"
            PKGS="$PKGS vulkan-utility-libraries-dev"
          else
            echo "No Vulkan validation/utility package available; continuing without it"
          fi

          echo "Installing: $PKGS"
          sudo apt-get install -y $PKGS

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neutrino-linux
          path: build/bin/Neutrino
